<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keegan's Art</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --text: #f0f0f5;
      --muted: #8888aa;
      --accent: #c9a0ff;
      --accent2: #7eb8ff;
    }
    
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }
    
    /* ─── INTRO ─── */
    .intro {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    .intro-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(201,160,255,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 70% 60%, rgba(126,184,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    
    .intro-label {
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }
    
    .intro-title {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s ease 0.6s forwards;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 50%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      max-width: 90vw;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    
    .intro-subtitle {
      margin-top: 1.5rem;
      font-size: 1rem;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 1s ease 0.9s forwards;
    }
    
    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 1s ease 1.4s forwards;
    }
    
    .scroll-arrow {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, var(--muted), transparent);
      animation: scrollPulse 2s ease infinite;
    }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    
    /* ─── GALLERY ─── */
    .gallery { padding: 2rem; max-width: 1400px; margin: 0 auto; }
    .gallery-header { text-align: center; margin-bottom: 3rem; }
    .gallery-header h2 { font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
    
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    
    .art-card {
      position: relative;
      border-radius: 0.75rem;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface);
      aspect-ratio: 4/3;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.7s ease, transform 0.7s ease, box-shadow 0.3s ease;
    }
    
    .art-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .art-card:hover {
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transform: translateY(-5px) scale(1.02);
    }
    
    .art-card img {
      width: 110%;
      height: 110%;
      object-fit: cover;
      display: block;
      margin: -5%;
      transition: transform 6s ease-in-out, opacity 0.5s ease;
    }
    
    .art-card:hover img { transform: scale(1.1) translateX(2%); }
    .art-card img.kenburns {
      animation: kenburns 20s ease-in-out infinite alternate;
    }
    
    @keyframes kenburns {
      0%   { transform: scale(1.0)  translate(0%, 0%); }
      25%  { transform: scale(1.08) translate(-2%, -1%); }
      50%  { transform: scale(1.05) translate(1%, 2%); }
      75%  { transform: scale(1.1)  translate(-1%, 1%); }
      100% { transform: scale(1.0)  translate(2%, -2%); }
    }
    
    .art-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: flex-end;
      padding: 1rem;
    }
    
    .art-card:hover .art-card-overlay { opacity: 1; }
    .art-card-label { font-size: 0.8rem; color: rgba(255,255,255,0.9); font-weight: 500; }
    
    /* ─── LIGHTBOX ─── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(5,5,10,0.97);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(20px);
    }
    
    .lightbox.open { opacity: 1; pointer-events: all; }
    
    .lightbox img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 0.5rem;
      box-shadow: 0 40px 100px rgba(0,0,0,0.8);
      transform: scale(0.9);
      transition: transform 0.4s ease;
    }
    
    .lightbox.open img { transform: scale(1); }
    
    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      font-size: 1.5rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .lightbox-close:hover { background: rgba(255,255,255,0.2); }
    
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      font-size: 2rem;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
    .lightbox-prev { left: 1.5rem; }
    .lightbox-next { right: 1.5rem; }
    
    /* ─── ADD MORE ─── */
    .add-more {
      max-width: 600px;
      margin: 3rem auto;
      padding: 3rem 2rem;
      border: 2px dashed rgba(201,160,255,0.3);
      border-radius: 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--surface);
    }
    
    .add-more:hover {
      border-color: var(--accent);
      background: rgba(201,160,255,0.05);
    }
    
    .add-more p { color: var(--muted); font-size: 0.9rem; }
    .add-more .icon { font-size: 2rem; margin-bottom: 1rem; }
    #file-input { display: none; }
    
    /* ─── FOOTER ─── */
    .footer {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }
    
    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: 1fr; }
      .add-more { margin: 2rem 1rem; }
    }
  </style>
</head>
<body>
  
  <!-- INTRO -->
  <section class="intro">
    <div class="intro-bg"></div>
    <div class="intro-label">Visual Artist</div>
    <h1 class="intro-title">Keegan</h1>
    <p class="intro-subtitle">A curated collection</p>
    <div class="scroll-hint">
      <span>Explore</span>
      <div class="scroll-arrow"></div>
    </div>
  </section>
  
  <!-- GALLERY -->
  <section class="gallery" id="gallery">
    <div class="gallery-header">
      <h2>Selected Works</h2>
    </div>
    <div class="gallery-grid" id="gallery-grid">
      <div class="art-card" onclick="openLightbox(0)">
        <img class="kenburns" src="https://raw.githubusercontent.com/lucasdan411/artfolio/main/artwork/keegan-1.jpg" alt="Keegan's Artwork 1">
        <div class="art-card-overlay"><span class="art-card-label">Untitled — 1</span></div>
      </div>
      <div class="art-card" onclick="openLightbox(1)">
        <img class="kenburns" src="https://raw.githubusercontent.com/lucasdan411/artfolio/main/artwork/keegan-2.jpg" alt="Keegan's Artwork 2">
        <div class="art-card-overlay"><span class="art-card-label">Untitled — 2</span></div>
      </div>
      <div class="art-card" onclick="openLightbox(2)">
        <img class="kenburns" src="https://raw.githubusercontent.com/lucasdan411/artfolio/main/artwork/keegan-3.jpg" alt="Keegan's Artwork 3">
        <div class="art-card-overlay"><span class="art-card-label">Untitled — 3</span></div>
      </div>
      <div class="art-card" onclick="openLightbox(3)">
        <img class="kenburns" src="https://raw.githubusercontent.com/lucasdan411/artfolio/main/artwork/keegan-4.jpg" alt="Keegan's Artwork 4">
        <div class="art-card-overlay"><span class="art-card-label">Untitled — 4</span></div>
      </div>
      <div class="art-card" onclick="openLightbox(4)">
        <img class="kenburns" src="https://raw.githubusercontent.com/lucasdan411/artfolio/main/artwork/keegan-5.jpg" alt="Keegan's Artwork 5">
        <div class="art-card-overlay"><span class="art-card-label">Untitled — 5</span></div>
      </div>
    </div>
  </section>
  
  <!-- ADD MORE -->
  <div class="add-more" id="add-zone" onclick="document.getElementById('file-input').click()">
    <div class="icon">🎨</div>
    <p>Add more artwork<br>drag & drop or click to browse</p>
    <input type="file" id="file-input" accept="image/*" multiple>
  </div>
  
  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">‹</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">›</button>
  </div>
  
  <!-- FOOTER -->
  <div class="footer">Keegan · Art Portfolio</div>
  
  <script>
    // ─── State ───
    const artworks = [
      'https://raw.githubusercontent.com/lucasdan411/artfolio/main/artwork/keegan-1.jpg',
      'https://raw.githubusercontent.com/lucasdan411/artfolio/main/artwork/keegan-2.jpg',
      'https://raw.githubusercontent.com/lucasdan411/artfolio/main/artwork/keegan-3.jpg',
      'https://raw.githubusercontent.com/lucasdan411/artfolio/main/artwork/keegan-4.jpg',
      'https://raw.githubusercontent.com/lucasdan411/artfolio/main/artwork/keegan-5.jpg'
    ];
    let currentIndex = 0;
    let userArtworks = [];
    
    // ─── Scroll Reveal ───
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 120);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });
    
    document.querySelectorAll('.art-card').forEach((card, i) => {
      setTimeout(() => card.classList.add('visible'), i * 120);
    });
    
    // ─── Add More Artwork ───
    const addInput = document.getElementById('file-input');
    const addZone = document.getElementById('add-zone');
    
    addZone.addEventListener('dragover', e => { e.preventDefault(); addZone.classList.add('dragover'); });
    addZone.addEventListener('dragleave', () => addZone.classList.remove('dragover'));
    addZone.addEventListener('drop', e => {
      e.preventDefault();
      addZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    addInput.addEventListener('change', () => handleFiles(addInput.files));
    
    function handleFiles(files) {
      Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = e => addUserArtwork(e.target.result, file.name);
        reader.readAsDataURL(file);
      });
    }
    
    function addUserArtwork(src, name) {
      userArtworks.push(src);
      const grid = document.getElementById('gallery-grid');
      const card = document.createElement('div');
      card.className = 'art-card visible';
      card.style.aspectRatio = 'auto';
      card.innerHTML = `<img src="${src}" alt="${name}"><div class="art-card-overlay"><span class="art-card-label">${name}</span></div>`;
      card.addEventListener('click', () => openLightbox(artworks.length + userArtworks.length - 1));
      grid.appendChild(card);
    }
    
    // ─── Lightbox ───
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    
    function openLightbox(index) {
      currentIndex = index;
      const allArt = [...artworks, ...userArtworks];
      lbImg.src = allArt[index];
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    
    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }
    
    function navigateLightbox(dir) {
      const allArt = [...artworks, ...userArtworks];
      currentIndex = (currentIndex + dir + allArt.length) % allArt.length;
      lbImg.src = allArt[currentIndex];
    }
    
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigateLightbox(-1);
      if (e.key === 'ArrowRight') navigateLightbox(1);
    });
    
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });
    
    // ─── Parallax on scroll ───
    window.addEventListener('scroll', () => {
      const scrolled = window.scrollY;
      const introTitle = document.querySelector('.intro-title');
      if (introTitle) {
        introTitle.style.transform = `translateY(${scrolled * 0.3}px)`;
        introTitle.style.opacity = Math.max(0, 1 - scrolled / 500);
      }
    });
  </script>
</body>
</html>
